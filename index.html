function renderNode(xmlEl) {
  const tag = xmlEl.tagName.toLowerCase().replace(/.*\./,'');
  const id = getAttr(xmlEl, 'android:id')?.replace('@+id/','').replace('@id/','') || null;

  let domEl;

  if(tag === 'linearlayout' || tag === 'linearlayoutcompat') {
    const orient = getAttr(xmlEl, 'android:orientation');
    domEl = document.createElement('div');
    domEl.className = orient === 'horizontal' ? 'a-linear-h' : 'a-linear-v';
  } else if(tag === 'relativelayout') {
    domEl = document.createElement('div');
    domEl.className = 'a-relative';
  } else if(tag === 'framelayout') {
    domEl = document.createElement('div');
    domEl.className = 'a-frame';
  } else if(tag === 'constraintlayout') {
    domEl = document.createElement('div');
    domEl.className = 'a-constraint a-linear-v';
  } else if(tag === 'scrollview') {
    domEl = document.createElement('div');
    domEl.className = 'a-scroll';
  } else if(tag === 'horizontalscrollview') {
    domEl = document.createElement('div');
    domEl.className = 'a-scroll-h';
  } else if(tag === 'textview') {
    domEl = document.createElement('div');
    domEl.className = 'a-textview';
    const text = resolveString(getAttr(xmlEl,'android:text') || '');
    domEl.textContent = text || '[ TextView ]';
    const size = getAttr(xmlEl,'android:textSize');
    if(size) domEl.style.fontSize = dpToPx(size);
    const color = getAttr(xmlEl,'android:textColor');
    if(color?.startsWith('#')) domEl.style.color = color;
    const bold = getAttr(xmlEl,'android:textStyle');
    if(bold?.includes('bold')) domEl.style.fontWeight = 'bold';
    const gravity = getAttr(xmlEl,'android:gravity') || getAttr(xmlEl,'android:textAlignment');
    if(gravity === 'center' || gravity === 'center_horizontal') domEl.style.textAlign = 'center';
  } else if(tag === 'button' || tag === 'materialbutton') {
    domEl = document.createElement('button');
    domEl.className = 'a-button';
    domEl.textContent = resolveString(getAttr(xmlEl,'android:text') || 'Button');
    const bg = getAttr(xmlEl,'android:backgroundTint') || getAttr(xmlEl,'app:backgroundTint');
    if(bg?.startsWith('#')) domEl.style.background = bg;
  } else if(tag === 'edittext' || tag === 'textinputedittext') {
    domEl = document.createElement('input');
    domEl.className = 'a-edittext';
    domEl.placeholder = resolveString(getAttr(xmlEl,'android:hint') || '');
    const inputType = getAttr(xmlEl,'android:inputType');
    if(inputType?.includes('password')) domEl.type = 'password';
    else if(inputType?.includes('number')) domEl.type = 'number';
    else domEl.type = 'text';
  } else if(tag === 'imageview') {
    domEl = document.createElement('div');
    domEl.className = 'a-imageview';
    const src = getAttr(xmlEl,'android:src') || getAttr(xmlEl,'app:srcCompat');
    domEl.textContent = src ? `[img: ${src.replace('@drawable/','')}]` : '[ImageView]';
  } else if(tag === 'toolbar' || tag === 'materialtoolbar') {
    domEl = document.createElement('div');
    domEl.className = 'a-toolbar';
    domEl.textContent = resolveString(getAttr(xmlEl,'android:title') || state.manifest.label || 'App');
  } else if(tag === 'recyclerview' || tag === 'listview') {
    domEl = document.createElement('div');
    domEl.className = 'a-recyclerview';
    for(let i=0; i<3; i++) {
      const item = document.createElement('div');
      item.className = 'a-list-item';
      item.textContent = `List item ${i+1}`;
      domEl.appendChild(item);
    }
  } else if(tag === 'cardview' || tag === 'materialcardview') {
    domEl = document.createElement('div');
    domEl.className = 'a-cardview';
  } else if(tag === 'checkbox') {
    domEl = document.createElement('label');
    domEl.className = 'a-checkbox';
    domEl.innerHTML = `<input type="checkbox"> ${resolveString(getAttr(xmlEl,'android:text')||'Checkbox')}`;
  } else if(tag === 'switch' || tag === 'switchcompat' || tag === 'switchmaterial') {
    domEl = document.createElement('label');
    domEl.className = 'a-switch';
    domEl.innerHTML = `<input type="checkbox" role="switch"> ${resolveString(getAttr(xmlEl,'android:text')||'Switch')}`;
  } else if(tag === 'progressbar') {
    domEl = document.createElement('div');
    domEl.className = 'a-progress';
    const fill = document.createElement('div');
    fill.className = 'a-progress-fill';
    domEl.appendChild(fill);
  } else if(tag === 'view' && getAttr(xmlEl,'android:background') === '#e0e0e0') {
    domEl = document.createElement('div');
    domEl.className = 'a-divider';
  } else if(tag === 'floatingactionbutton' || tag === 'extendedfoatingactionbutton') {
    domEl = document.createElement('button');
    domEl.className = 'a-fab';
    domEl.textContent = '+';
  } else if(tag === 'bottmnavigationview' || tag === 'bottomnavigationview') {
    domEl = document.createElement('div');
    domEl.className = 'a-nav';
    ['Home','Search','Profile'].forEach((label,i) => {
      const item = document.createElement('div');
      item.className = `a-nav-item ${i===0?'active':''}`;
      item.innerHTML = `<span class="a-nav-icon">${['🏠','🔍','👤'][i]}</span>${label}`;
      domEl.appendChild(item);
    });
  } else if(tag === 'include') {
    const layout = getAttr(xmlEl,'layout')?.replace('@layout/','');
    domEl = document.createElement('div');
    domEl.style.cssText = 'border:1px dashed #ccc;padding:4px;font-size:10px;color:#999;';
    domEl.textContent = `[include: ${layout||'?'}]`;
    if(layout && state.layouts[layout]) {
      try {
        const parser = new DOMParser();
        const doc = parser.parseFromString(state.layouts[layout], 'text/xml');
        const incRoot = doc.documentElement;
        domEl = renderNode(incRoot);
      } catch(e) {}
    }
  } else if(tag === 'merge') {
    domEl = document.createElement('div');
    domEl.style.display = 'contents';
  } else if(tag === 'viewstub') {
    domEl = document.createElement('div'); // invisible placeholder
    domEl.style.display = 'none';
  } else {
    // Generic container
    domEl = document.createElement('div');
    domEl.style.cssText = 'min-height:4px;width:100%;';
  }

  if(id) { domEl.id = id; domEl.dataset.aid = id; }
  domEl.dataset.tag = tag;
  applySize(domEl, xmlEl);
  applyMarginPadding(domEl, xmlEl);

  // Visibility
  const vis = getAttr(xmlEl,'android:visibility');
  if(vis === 'gone') domEl.style.display = 'none';
  else if(vis === 'invisible') domEl.style.opacity = '0';

  // Recurse children (skip for leaf elements)
  if(!['textview','button','materialbutton','edittext','imageview','checkbox','switch','switchcompat'].includes(tag)) {
    Array.from(xmlEl.children).forEach(child => {
      try { domEl.appendChild(renderNode(child)); } catch(e) {}
    });
  }

  return domEl;
}

  screen.innerHTML = `

// ─── Scripting API ────────────────────────────────────────────────────────────
const apk = {
  getScreen: (name) => state.layouts[name] || null,
  getManifest: () => ({ ...state.manifest }),
  get elements() {
    return Array.from(document.getElementById('phoneScreen').querySelectorAll('*'));
  },
  find: (selector) => {
    try { return Array.from(document.getElementById('phoneScreen').querySelectorAll(selector)); }
    catch(e) { return []; }
  },
  setAttr: (el, attr, val) => {
    if(!el) return;
    const els = Array.isArray(el) ? el : [el];
    els.forEach(e => { e[attr] = val; });
  },
  getString: (key) => state.strings[key] || null,
  getStrings: () => ({ ...state.strings }),
  highlight: (selector) => {
    document.getElementById('phoneScreen').querySelectorAll('.selected-el').forEach(x=>x.classList.remove('selected-el'));
    apk.find(selector).forEach(el => el.classList.add('selected-el'));
  },
  listScreens: () => Object.keys(state.layouts),
  switchScreen: (name) => switchScreen(name),
};

// Override console for script sandbox
const sandboxConsole = {
  log: (...args) => log(args.join(' '), 'info'),
  error: (...args) => log(args.join(' '), 'error'),
  warn: (...args) => log(args.join(' '), 'warn'),
  info: (...args) => log(args.join(' '), 'info'),
};

function runScript() {
  const code = document.getElementById('scriptInput').value.trim();
  if(!code) { log('No script to run.', 'warn'); return; }
  log('Running script...', 'system');
  try {
    const fn = new Function('apk','console', code);
    fn(apk, sandboxConsole);
  } catch(err) {
    log(`Script error: ${err.message}`, 'error');
  }
}

function clearScript() {
  document.getElementById('scriptInput').value = '';
}

// Keyboard shortcut: Ctrl/Cmd+Enter to run
document.getElementById('scriptInput').addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runScript(); }
});
